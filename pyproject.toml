[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-gitea"
authors = [{ name = "Isaac C. F. Wong", email = "isaac.cf.wong@gmail.com" }]
description = "A Python package for interacting with the Gitea API, offering a simple interface to access repositories, users, organizations, issues, and more for automation and data management."
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "typer>=0.21.1",
  "requests>=2.32.5",
  "aiohttp>=3.13.3",
  "pydantic>=2.12.5",
  "platformdirs>=4.3.6",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "ruff>=0.16.3",
  # The mutation runner, in the environment `uv run` resolves, so that
  # `uv run mutmut run` reaches the same interpreter as `uv run pytest` and finds
  # the pytest plugins the suite's own options need. Run from a tool environment
  # of its own it cannot read `--cov`, and the run dies at collection.
  "mutmut>=3.7.0",
  "prek>=0.4.13",
  "pytest-github-actions-annotate-failures>=0.4.2",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
  "mkdocs-gen-files>=0.6.1",
  "mkdocs-literate-nav>=0.6.3",
  "mkdocs-section-index>=0.3.12",
  "mike>=2.2.0",
]
build = ["hatch>=1.18.0"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gitea-cli = "gitea.cli.main:app"

[project.urls]
Documentation = "https://isaac-cf-wong.github.io/python-gitea"
Source = "https://github.com/isaac-cf-wong/python-gitea"
Tracker = "https://github.com/isaac-cf-wong/python-gitea/issues"
Home = "https://github.com/isaac-cf-wong/python-gitea"
"Release Notes" = "https://github.com/isaac-cf-wong/python-gitea/releases"

[tool.dependency-support-policy]
# Rolling support floors (SPEC 0): runtime lower bounds are raised on a schedule
# by the support_floor_update.yml workflow, not by Renovate. See renovate.json.
policy = "spec0"
groups = ["project"]
lock = "minimal"
# For packages with ecosystem siblings released in lockstep, exclude them here
# and let Renovate keep them at latest, e.g.:
# exclude = ["my-sibling-package"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/gitea"]

[tool.mutmut]
# The suite imports from `scripts/` (see `pythonpath` under
# `[tool.pytest.ini_options]`), so the copy of the tree that mutmut runs it from
# needs that directory as well - without it every mutant is reported as killed by
# a collection error in `tests/test_release_version.py`.
source_paths = ["src/gitea/"]
also_copy = ["scripts/"]
# mutmut runs the suite against a rewritten copy of each module, in which every
# mutated function is replaced by a table of its variants. A test reading a module
# rather than calling it therefore reads the instrumentation rather than the code,
# and fails for every mutant - a red baseline, which reports every mutant as
# killed. Two do: one asserts on the *text* of a module, the other enumerates the
# methods of a class, which the variants are bound to as members of. Both are
# deselected here, and are run by `pytest` as usual.
pytest_add_cli_args = [
  "--deselect",
  "tests/utils/test_utils_pagination.py::TestEndOfListing::test_the_walkers_decide_nothing_of_their_own",
  "--deselect",
  "tests/project/test_project_requests.py::test_every_project_method_is_declared",
]
# A mutant is judged to hang when its tests exceed `timeout_multiplier` times what
# they took clean, plus this constant. Most tests here take a millisecond or two,
# so the default constant of one second leaves a budget an unmutated run can miss
# on a loaded machine - and a mutant reported as a timeout has no verdict at all:
# it is not known to be caught, and it is not reported as surviving either. Ten
# seconds is still far below anything a real hang would finish in.
timeout_constant = 10.0

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-append -m 'not integration' --cov-report=term-missing"
pythonpath = ["src", "scripts"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py, integration, spark, all

[testenv]
commands =
    pytest -m "not integration and not spark" {posargs}

[testenv:integration]
commands =
    pytest -m "integration" {posargs}

[testenv:spark]
extras = spark
setenv =
       PYSPARK_DRIVER_PYTHON = {envpython}
       PYSPARK_PYTHON = {envpython}
commands =
    pytest -m "spark" {posargs}

[testenv:all]
extras = all
setenv =
       PYSPARK_DRIVER_PYTHON = {envpython}
       PYSPARK_PYTHON = {envpython}
commands =
    pytest {posargs}
"""

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with CI (3.12–3.14) and requires-python (>=3.12)
lint.extend-select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "DOC", # Docstring
  "D",   # Doc style
  "S",   # Security
]
lint.ignore = [
  "E501",    # Line length (handled by formatter)
  "C901",    # Disable overly strict complexity checks (optional, adjust as needed)
  "PLR0913", # Too many arguments: API-client methods mirror REST endpoint parameters
  "PLR0917", # Too many positional arguments: CLI commands mirror Gitea API fields
]
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = [
  "S101",    # allow assert statements
  "S102",    # allow exec in import/version tests
  "S105",    # allow hardcoded test tokens/passwords in fixtures
  "S106",    # allow hardcoded test tokens/passwords in fixtures
  "S108",    # allow hardcoded /tmp paths in tests
  "DTZ001",  # allow naive datetimes in test fixtures
  "ARG001",  # allow unused function arguments (common in fixtures)
  "PLC0415", # allow import statements not at the top level
  "PLR2004", # allow magic values in the unit tests
]
